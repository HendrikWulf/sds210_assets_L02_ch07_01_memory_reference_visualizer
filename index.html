<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory Reference Visualizer</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f8fafc;
            color: #0f172a;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            box-sizing: border-box;
        }
        .container {
            width: 100%;
            max-width: 850px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            border: 1px solid #e2e8f0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        h3 {
            margin-top: 0;
            color: #1e293b;
            font-size: 1.2rem;
            border-bottom: 2px solid #f1f5f9;
            padding-bottom: 10px;
            text-align: center;
        }
        .scenarios {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }
        .scenario-box {
            background: #f1f5f9;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }
        .scenario-title {
            font-size: 0.95rem;
            font-weight: bold;
            color: #334155;
            margin-bottom: 15px;
            font-family: monospace;
        }
        .variable {
            background: #3b82f6;
            color: white;
            padding: 5px 15px;
            border-radius: 4px;
            font-weight: bold;
            font-family: monospace;
            text-align: center;
        }
        .memory-block {
            background: #fef3c7;
            border: 2px solid #f59e0b;
            padding: 10px 15px;
            border-radius: 8px;
            font-family: monospace;
            font-size: 1.1rem;
            font-weight: bold;
            color: #b45309;
            text-align: center;
            transition: all 0.3s ease;
        }
        .highlight {
            background: #dcfce7;
            border-color: #22c55e;
            color: #166534;
            transform: scale(1.05);
        }
        .btn-run {
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: bold;
            font-family: monospace;
            cursor: pointer;
            transition: background 0.2s;
            align-self: center;
        }
        .btn-run:hover { background-color: #1d4ed8; }
        .btn-run:disabled { background-color: #94a3b8; cursor: not-allowed; }
        .btn-reset {
            background-color: #e2e8f0;
            color: #475569;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 0.9rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            align-self: center;
        }
        .btn-reset:hover { background-color: #cbd5e1; }
        .explanation {
            background: #e0f2fe;
            border-left: 4px solid #0284c7;
            padding: 15px;
            border-radius: 4px;
            color: #0369a1;
            font-size: 0.95rem;
            text-align: center;
            line-height: 1.5;
        }
        /* Straight downward arrows */
        .arrow-down {
            width: 2px;
            height: 25px;
            background: #94a3b8;
            margin: 0 auto 5px auto;
            position: relative;
        }
        .arrow-down::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: -4px;
            border-width: 5px 5px 0;
            border-style: solid;
            border-color: #94a3b8 transparent transparent transparent;
        }
    </style>
</head>
<body>

<div class="container">
    <h3>Memory Visualizer: Referencing vs. Copying</h3>
    
    <div class="scenarios">
        <div class="scenario-box" style="flex: 1; min-width: 250px;">
            <div class="scenario-title">b = a (Reference)</div>
            
            <div style="display: flex; justify-content: center; gap: 30px; margin-bottom: 5px;">
                <div style="display: flex; flex-direction: column; align-items: center;">
                    <div class="variable">a</div>
                    <div class="arrow-down"></div>
                </div>
                <div style="display: flex; flex-direction: column; align-items: center;">
                    <div class="variable" style="background: #8b5cf6;">b</div>
                    <div class="arrow-down"></div>
                </div>
            </div>
            
            <div class="memory-block" id="mem1" style="width: 160px; margin: 0 auto;">[1, 2, 3]</div>
            <div style="margin-top:5px; font-size:0.85rem; color:#64748b; text-align: center;">Memory Block 0x1A</div>
        </div>

        <div class="scenario-box" style="flex: 1.5; min-width: 350px;">
            <div class="scenario-title">c = a.copy() (Independent)</div>
            
            <div style="display: flex; justify-content: space-around; width: 100%;">
                
                <div style="display: flex; flex-direction: column; align-items: center;">
                    <div style="display: flex; gap: 20px; margin-bottom: 5px;">
                        <div style="display: flex; flex-direction: column; align-items: center;">
                            <div class="variable">a</div>
                            <div class="arrow-down"></div>
                        </div>
                        <div style="display: flex; flex-direction: column; align-items: center;">
                            <div class="variable" style="background: #8b5cf6;">b</div>
                            <div class="arrow-down"></div>
                        </div>
                    </div>
                    <div class="memory-block" id="mem2" style="width: 140px; margin: 0 auto;">[1, 2, 3]</div>
                    <div style="margin-top:5px; font-size:0.85rem; color:#64748b; text-align: center;">Memory Block 0x1A</div>
                </div>

                <div style="display: flex; flex-direction: column; align-items: center;">
                    <div style="display: flex; flex-direction: column; align-items: center; margin-bottom: 5px;">
                        <div class="variable" style="background: #10b981;">c</div>
                        <div class="arrow-down"></div>
                    </div>
                    <div class="memory-block" id="mem3" style="width: 100px; margin: 0 auto;">[1, 2, 3]</div>
                    <div style="margin-top:5px; font-size:0.85rem; color:#64748b; text-align: center;">Memory Block 0x2B</div>
                </div>

            </div>
        </div>
    </div>

    <button class="btn-run" id="runBtn" onclick="runAppend()">Run: a.append(99)</button>
    <button class="btn-reset" onclick="reset()">Reset Simulation</button>
    
    <div class="explanation" id="expBox">
        Click the Run button to append 99 to variable 'a' and watch how the memory blocks react!
    </div>
</div>

<script>
    function runAppend() {
        const mem1 = document.getElementById('mem1');
        const mem2 = document.getElementById('mem2');
        const mem3 = document.getElementById('mem3');
        const expBox = document.getElementById('expBox');
        const runBtn = document.getElementById('runBtn');

        runBtn.disabled = true;

        // Update BOTH Block 0x1A representations simultaneously
        mem1.textContent = "[1, 2, 3, 99]";
        mem1.classList.add('highlight');

        mem2.textContent = "[1, 2, 3, 99]";
        mem2.classList.add('highlight');

        // DO NOT update mem3 (0x2B) because it's a separate copy!

        expBox.innerHTML = "<b>Notice what happened!</b><br>Both <code>a</code> and <code>b</code> updated instantly because they share the exact same <b>Memory Block 0x1A</b>.<br>However, <code>c</code> remains completely untouched because <code>.copy()</code> gave it its own independent <b>Memory Block 0x2B</b>.";
    }

    function reset() {
        document.getElementById('mem1').textContent = "[1, 2, 3]";
        document.getElementById('mem1').classList.remove('highlight');
        
        document.getElementById('mem2').textContent = "[1, 2, 3]";
        document.getElementById('mem2').classList.remove('highlight');
        
        document.getElementById('mem3').textContent = "[1, 2, 3]";
        
        document.getElementById('expBox').innerHTML = "Click the Run button to append 99 to variable 'a' and watch how the memory blocks react!";
        document.getElementById('runBtn').disabled = false;
    }
</script>

</body>
</html>
